      <stop offset="0" stop-color="#3cc4be"/>
      <stop offset="1" stop-color="#167f7b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="art">
    <!-- pole + legs -->
