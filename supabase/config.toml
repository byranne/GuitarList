project_id = "malguitar"

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
# Invite-only: accounts are created from the dashboard (Auth → Add/Invite user).
# The hosted project needs the same: turn off "Allow new users to sign up".
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# This is the email *provider* switch; leave it on. [auth] enable_signup blocks new users.
enable_signup = true
otp_length = 6
otp_expiry = 3600

# signInWithOtp sends this template; it must show the 6-digit code, not a link
# (on iOS a link opens Safari, which doesn't share storage with the home-screen app).
[auth.email.template.magic_link]
subject = "Your MALguitar sign-in code"
content_path = "./supabase/templates/verify-code.html"
