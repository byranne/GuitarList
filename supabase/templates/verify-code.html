<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0B0B0F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0B0F;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#16161D;border-radius:16px;padding:32px;">
            <tr>
              <td style="color:#F5F5F7;font-size:24px;font-weight:800;padding-bottom:16px;">
                MAL<span style="color:#FF5A36;">guitar</span>
              </td>
            </tr>
            <tr>
              <td style="color:#8E8E9A;font-size:15px;line-height:22px;padding-bottom:24px;">
                Enter this code in MALguitar to verify your email.
              </td>
            </tr>
            <tr>
              <td style="color:#F5F5F7;font-size:36px;font-weight:700;letter-spacing:8px;padding-bottom:24px;">
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="color:#8E8E9A;font-size:13px;line-height:18px;">
                The code expires in 1 hour. If you didn't ask for it, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
